services:
  - type: web
    name: martinez-gestion-vehicular
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: FRONTEND_URL
        sync: false
